# Production reverse proxy (used by the deploy branch's docker-compose.yaml,
# mounted as /etc/nginx/conf.d/default.conf). Plain nginx config: the domain
# and the app port were baked in by gitflow_master_init.sh.

server {
    listen 80;

    server_name __DOMAIN__;

    location ~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;

    server_name __DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    # Resolve the upstream per request through Docker's embedded DNS. A literal
    # `proxy_pass http://web_server:PORT` is resolved once at nginx start and
    # cached forever; every web_server recreate (each release) may change its
    # IP -> 502s. Never collapse it back to the literal form.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~ / {
        set $web_server_host web_server;
        # no path (not even a single /) after the port in `proxy_pass`
        proxy_pass http://$web_server_host:__APP_PORT__;
        client_max_body_size 5M;

        proxy_http_version 1.1;
    }
}
