# Production stack (deploy branch only — DEPLOY_OWNED in scripts/gitflow/gitflow.conf,
# so promotions never replace it). Domain and email were baked in by
# gitflow_master_init.sh. The first certificate must exist before nginx can
# start its 443 server: issue it once with certbot's standalone mode, e.g.
#   docker compose run --rm -p 80:80 --entrypoint certbot certbot certonly --standalone \
#     --non-interactive --agree-tos --no-eff-email --email __CERTBOT_EMAIL__ -d __DOMAIN__
services:

  web_server:
    build: ./app
    restart: always

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/html:ro
    depends_on:
      - web_server

  certbot:
    image: certbot/certbot
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt:rw
      - ./nginx/certbot/www:/var/www/html:rw
    # Runs once per `up` and exits; --keep-until-expiring makes that a no-op
    # until renewal is due.
    command: certonly --webroot -w /var/www/html/ --keep-until-expiring --non-interactive --agree-tos --no-eff-email --email __CERTBOT_EMAIL__ -d __DOMAIN__
