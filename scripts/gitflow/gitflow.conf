# Per-repo settings for the gitflow scripts at the project root — sourced by lib.sh.
# Written by gitflow_master_init.sh from its dialog; edit it on a dev branch
# like any other file. Bash syntax, paths relative to the project root.

# Docker build context of the app (sync_deploy_vps.sh reminds to rebuild when it changes).
APP_DIR="app"
# Compose service of the app, and the port it listens on inside the container.
WEB_SERVICE="web_server"
APP_PORT="8008"

# Automated tests run on the host by finish_stage.sh; empty = no automated tests.
#   e.g. "venv/bin/python -m unittest discover -s tests -t ." | "npm test" | "go test ./..."
TEST_CMD=""
# Optional command run by dr_rebuild.sh inside a throw-away container of the new image.
IMAGE_TEST_CMD=""
# Language toolchain gitflow_init.sh checks for (warnings only), space-separated.
REQUIRED_TOOLS=""

# Branch path policy (promote_deploy.sh, sync_deploy_vps.sh):
#   DEPLOY_OWNED — deploy keeps its own version whatever dev did (prod compose).
#   DEV_ONLY     — never reaches deploy (minus the DEPLOY_KEEP entries under it).
#   DEPLOY_KEEP  — paths under DEV_ONLY that deploy needs; 3-way merged.
DEPLOY_OWNED=("docker-compose.yaml" ".gitignore")
DEV_ONLY=()
DEPLOY_KEEP=()
