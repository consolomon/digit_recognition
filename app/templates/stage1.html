<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stage 1 — Binary Classification</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="nav-brand">Digit Recognition</a>
        <div class="nav-tabs">
            <a href="/stage1/" class="nav-tab active">Stage 1</a>
            <a href="/stage2/" class="nav-tab">Stage 2</a>
            <a href="/stage3/" class="nav-tab">Stage 3</a>
            <a href="/history/" class="nav-tab">History</a>
        </div>
    </nav>

    <main class="stage-main">
        <h1>Stage 1 — Binary Classification</h1>
        <p class="stage-desc">Draw a 0 or 1 on the 3×3 grid, then click <em>Recognize</em>.</p>

        <div class="box">
            <div class="grid" id="grid"></div>
            <button class="btn recognize-btn" id="recognizeBtn">Recognize</button>
            <button class="btn refresh-btn" id="refreshBtn">Refresh</button>
        </div>
        <div class="result-box" id="result"></div>
    </main>

    <script src="{{ url_for('static', filename='stage1.js') }}"></script>
</body>
</html>
