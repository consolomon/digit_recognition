{% extends 'base.html' %}
{% set active_page = 'stage1' %}

{% block title %}Stage 1 — Binary Classification{% endblock %}

{% block content %}
    <main class="stage-main container">
        <header class="stage-header">
            <span class="label label-accent">Stage 01</span>
            <h1>Stage 1 — Binary Classification</h1>
            <p class="stage-desc">Draw a 0 or 1 on the 3×3 grid, then click <em>Recognize</em>.</p>
        </header>

        <div class="workspace">
            <div class="panel">
                <div class="grid" id="grid"></div>
                <div class="button-row">
                    <button class="btn recognize-btn" id="recognizeBtn">Recognize</button>
                    <button class="btn btn-ghost refresh-btn" id="refreshBtn">Refresh</button>
                </div>
            </div>
            <section class="output" aria-live="polite">
                <span class="label">Output</span>
                <div class="result-box" id="result"></div>
            </section>
        </div>
    </main>
{% endblock %}

{% block scripts %}
    <script src="{{ url_for('static', filename='stage1.js') }}"></script>
{% endblock %}
