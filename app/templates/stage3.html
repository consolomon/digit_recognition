<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stage 3 — Digit Recognition</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="nav-brand">Digit Recognition</a>
        <div class="nav-tabs">
            <a href="/stage1/" class="nav-tab">Stage 1</a>
            <a href="/stage2/" class="nav-tab">Stage 2</a>
            <a href="/stage3/" class="nav-tab active">Stage 3</a>
            <a href="/history/" class="nav-tab">History</a>
        </div>
    </nav>

    <main class="stage-main">
        <h1>Stage 3 — Digit Recognition</h1>
        <p class="stage-desc">Draw a digit (0–9) or upload an image, then click <em>Recognize</em>.</p>

        <div class="stage-layout">
            <div class="box">
                <canvas id="drawCanvas" class="draw-canvas" width="280" height="280"></canvas>
            </div>
            <div class="box side-menu">
                <button class="btn recognize-btn" id="clearBtn">Clear</button>
                <button class="btn recognize-btn" id="uploadBtn">Upload Image</button>
                <input type="file" id="fileInput" accept="image/*" style="display:none">
                <button class="btn btn-primary recognize-btn" id="recognizeBtn">Recognize</button>
            </div>
        </div>
        <div class="result-box" id="result"></div>
    </main>

    <script src="{{ url_for('static', filename='stage3.js') }}"></script>
</body>
</html>
