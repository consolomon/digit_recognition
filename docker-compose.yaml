# Local development stack (master / dev branches). The deploy branch keeps
# its own production version (web_server + nginx + certbot) — see
# resources/documentation/GITFLOW_INIT.md §3.5.
services:

  web_server:
    build: ./app
    image: dr_web_server:latest
    container_name: dr_web_server
    restart: unless-stopped
    ports:
      # Host port 8001 is often taken locally — override with WEB_HOST_PORT.
      - "${WEB_HOST_PORT:-8001}:8001"
