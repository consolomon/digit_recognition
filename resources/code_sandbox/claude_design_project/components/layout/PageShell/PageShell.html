<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>PageShell</title>
<style>
:root {
    /* colour: achromatic field + one accent */
    --bg:            #000000;   /* page field */
    --field:         #0d0d0d;   /* tile off, raised panels */
    --g1:            #171717;   /* hover fill */
    --line:          #303030;   /* hairlines, panel borders */
    --line-strong:   #4c4c4c;   /* button + grid borders */
    --g4:            #616161;   /* decorative only (< 4.5:1 on black) */
    --muted:         #8f8f8f;   /* secondary text */
    --soft:          #c7c7c7;   /* body text */
    --bright:        #e0e0e0;   /* body text over the network */
    --ink:           #ffffff;   /* headings, tile on, frame, card border */
    --accent:        #38bdf8;   /* the only hue: active, primary, result */
    --accent-hover:  #7dd3fc;
    --accent-dim:    rgba(56, 189, 248, 0.12);

    /* type: JetBrains Mono, ratio 1.25 */
    --font: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
    --fs-display: 3.0625rem;    /* 49px */
    --fs-title:   1.9375rem;    /* 31px */
    --fs-heading: 1.25rem;      /* 20px */
    --fs-body:    1rem;         /* 16px */
    --fs-ui:      0.875rem;     /* 14px */
    --fs-label:   0.75rem;      /* 12px */
    --tracking-label: 0.14em;

    /* space: 4 · 8 · 12 · 16 · 24 · 32 · 48 · 64 · 96 */
    --s1: 4px;  --s2: 8px;  --s3: 12px; --s4: 16px; --s5: 24px;
    --s6: 32px; --s7: 48px; --s8: 64px; --s9: 96px;

    /* layout */
    --column:       1120px;     /* content column, incl. gutters */
    --gutter:       56px;
    --frame-inset:  20px;
    --frame-width:  2px;
    --nav-height:   64px;
    --control-h:    44px;       /* buttons: min touch target */
    --radius-btn:   2px;        /* everything else is square */
}
/* Signal on Black — component styles, copied from app/static/style.css
   (sections Navbar → Partners). Tokens come from tokens.css (tokens.json);
   the app's page shell (body overflow, fixed frame/viewport) is left out so
   previews render in their frame. */
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap');


*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.container { width: 100%; max-width: var(--column); margin: 0 auto; padding: 0 var(--gutter); }
.frame-demo { position: relative; border: var(--frame-width) solid var(--ink); }

/* ── Navbar ── */
.navbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    flex-wrap: wrap;
    gap: var(--s4);
    justify-content: space-between;
    align-items: center;
    min-height: var(--nav-height);
    padding: 0 var(--gutter);
    background: var(--bg);
    border-bottom: 1px solid var(--line);
}

.nav-brand {
    padding: 20px 0;
    font-size: var(--fs-ui);
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink);
    text-decoration: none;
}

.nav-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: var(--s5) 28px;
}

.nav-tab {
    font-size: var(--fs-ui);
    color: var(--soft);
    text-decoration: underline;
    text-decoration-color: var(--line-strong);
    text-decoration-thickness: 1px;
    text-underline-offset: 7px;
    transition: color 0.12s, text-decoration-color 0.12s;
}

.nav-tab:hover {
    color: var(--ink);
    text-decoration-color: var(--ink);
}

.nav-tab.active {
    color: var(--accent);
    text-decoration-color: var(--accent);
    text-decoration-thickness: 2px;
}

/* ── Buttons ── */
.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: var(--control-h);
    padding: 0 22px;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-btn);
    background: var(--bg);
    color: var(--ink);
    font-family: inherit;
    font-size: var(--fs-ui);
    letter-spacing: 0.02em;
    text-decoration: none;
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s, color 0.12s;
}

.btn:hover {
    border-color: var(--accent);
    color: var(--accent);
}

.btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--bg);
    font-weight: 600;
}

.btn-primary:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
    color: var(--bg);
}

.btn-ghost {
    border-color: transparent;
    color: var(--muted);
    text-decoration: underline;
    text-decoration-color: var(--line-strong);
    text-underline-offset: 6px;
}

.btn-ghost:hover {
    border-color: transparent;
    color: var(--ink);
    text-decoration-color: var(--ink);
}

/* ── Typography helpers ── */
.label {
    font-size: var(--fs-label);
    font-weight: 500;
    letter-spacing: var(--tracking-label);
    text-transform: uppercase;
    color: var(--muted);
}

.label-accent {
    color: var(--accent);
}

/* ── Landing: hero ── */
.hero {
    padding-top: var(--s9);
    padding-bottom: var(--s8);
    display: flex;
    flex-direction: column;
    gap: var(--s6);
}

.hero h1 {
    font-size: var(--fs-display);
    font-weight: 400;
    line-height: 1.15;
    letter-spacing: -0.01em;
}

.hero-body {
    max-width: 640px;
    font-size: var(--fs-body);
    line-height: 1.75;
    color: var(--bright);
}

.hero-body.lead {
    color: var(--ink);
}

/* ── Landing: stages ── */
.stages-section {
    padding-bottom: var(--s8);
}

.section-head {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: var(--s6);
}

.section-head::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--line);
}

.stages-overview {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: var(--s5);
}

.stage-card {
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: var(--s6) 28px;
    background: var(--bg);
    border: 1px solid var(--ink);
}

.stage-card h2 {
    font-size: var(--fs-heading);
    font-weight: 500;
}

.stage-card p {
    flex: 1;
    font-size: var(--fs-ui);
    line-height: 1.7;
    color: var(--muted);
}

.stage-card strong {
    color: var(--ink);
    font-weight: 500;
}

.stage-card .btn {
    align-self: flex-start;
    margin-top: var(--s2);
}

/* ── Stage pages ── */
.stage-main {
    flex: 1 0 auto;
    padding-top: 72px;
    padding-bottom: var(--s9);
    display: flex;
    flex-direction: column;
    gap: 40px;
}

.stage-header {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.stage-header h1 {
    font-size: var(--fs-title);
    font-weight: 400;
    line-height: 1.2;
}

.stage-desc {
    font-size: var(--fs-body);
    line-height: 1.7;
    color: var(--muted);
}

.stage-desc em {
    font-style: normal;
    color: var(--ink);
    text-decoration: underline;
    text-underline-offset: 5px;
}

/* workspace: input panel · controls · output, wraps on narrow screens */
.workspace {
    display: flex;
    flex-wrap: wrap;
    gap: var(--s5);
    align-items: stretch;
}

.panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 40px;
    background: var(--bg);
    border: 1px solid var(--line);
}

@media (max-width: 640px) {
    .panel {
        flex: 1 1 100%;
        padding: var(--s5) var(--s4);
    }
}

.controls {
    min-width: 200px;
    align-items: stretch;
    justify-content: flex-end;
    gap: var(--s3);
    padding: 28px;
}

.controls .label {
    margin-bottom: auto;
}

.button-row {
    display: flex;
    gap: var(--s3);
}

/* ── Tile grid (stages 1–2; stage2.js sets the 3×5 template) ── */
.grid {
    display: grid;
    grid-template-columns: repeat(3, 60px);
    grid-template-rows: repeat(3, 60px);
    border: 1px solid var(--line-strong);
}

.tile {
    width: 60px;
    height: 60px;
    background: var(--field);
    border: 1px solid var(--line);
    cursor: pointer;
    transition: background 0.1s;
}

.tile:not(.on):hover {
    background: var(--g1);
}

.tile.on {
    background: var(--ink);
}

/* ── Stage 3 draw canvas (pixels stay MNIST: white on black, set in stage3.js) ── */
.draw-canvas {
    display: block;
    max-width: 100%;            /* stage3.js maps pointer coords through the CSS size */
    height: auto;
    outline: 1px solid var(--line-strong);
    cursor: crosshair;
    touch-action: none;
}

.canvas-note {
    align-self: flex-start;
    font-size: var(--fs-label);
    color: var(--muted);
}

/* ── Output panel (stage JS writes into #result; the frame reacts to it) ── */
.output {
    flex: 1 1 300px;
    min-width: 260px;
    display: flex;
    flex-direction: column;
    gap: var(--s3);
    padding: 28px;
    background: var(--bg);
    border: 1px solid var(--line);
}

.output:has(.result-box:not(:empty)) {
    border-color: var(--accent);
}

.output:has(.result-box:not(:empty)) .label {
    color: var(--accent);
}

.result-box {
    font-size: var(--fs-body);
    line-height: 1.9;
    color: var(--soft);
}

.result-box:empty::before {
    content: 'awaiting input';
    color: var(--muted);
}

.result-row {
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
}

/* ── History page wrapper (chart chrome lives in history.js) ── */
.history-main {
    padding-top: 72px;
    padding-bottom: var(--s9);
    max-width: 1012px;
}

/* ── Partners footer (partials/_partners.html, on every page) ── */
.partners {
    margin-top: auto;
    flex-shrink: 0;
    padding-bottom: 72px;
}

.partners-list {
    display: flex;
    flex-wrap: wrap;
    gap: var(--s5) var(--s6);
    padding: 28px;
    background: var(--bg);
    list-style: none;
}

.partner {
    flex: 1 1 260px;
    display: flex;
    gap: 20px;
    align-items: center;
    justify-content: center;
}

.partner img {
    display: block;
    width: 64px;
    height: 64px;
    flex-shrink: 0;
}

.partner-text {
    display: flex;
    flex-direction: column;
    gap: var(--s2);
    min-width: 0;
    font-size: var(--fs-body);
}

.partner-handle {
    color: var(--soft);
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 6px;
}

</style></head>
