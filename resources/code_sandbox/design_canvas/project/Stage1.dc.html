<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stage 1 — Binary Classification</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000000}
a{color:#ffffff}a:hover{color:#38bdf8}
.bg-image{background:#000000 url(/_blob/92a06f857642bbb3e21e56cd64b73fb9) no-repeat center bottom/100% auto}
.bg-svg{background:#000000 url(/_blob/dee011ae0935568c884175fee17252f0) no-repeat center bottom/100% auto}
.bg-none{background:#000000}
.tab{color:#c7c7c7;text-decoration:underline;text-decoration-color:#4c4c4c;text-decoration-thickness:1px;text-underline-offset:7px}
.tab:hover{color:#ffffff;text-decoration-color:#ffffff}
.tab-active{color:#38bdf8;text-decoration-color:#38bdf8;text-decoration-thickness:2px}
.btn{font-family:inherit;font-size:14px;letter-spacing:.02em;padding:0 22px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:2px;border:1px solid #4c4c4c;background:#000000;color:#ffffff;cursor:pointer;text-decoration:none}
.btn:hover{border-color:#38bdf8;color:#38bdf8}
.btn-ghost{border-color:transparent;color:#8f8f8f;text-decoration:underline;text-underline-offset:6px;text-decoration-color:#4c4c4c}
.btn-ghost:hover{border-color:transparent;color:#ffffff;text-decoration-color:#ffffff}
.tile{display:block;width:60px;height:60px;padding:0;margin:0;background:#0d0d0d;border:1px solid #303030;cursor:pointer}
.tile:hover{background:#171717}
.tile-on,.tile-on:hover{background:#ffffff}
.meta{color:#c7c7c7;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:6px}
</style>
</helmet>
<div class="bg-{{bg}}" style="position: relative; height: 100vh; min-height: 560px; overflow: hidden; color: #ffffff; font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; -webkit-font-smoothing: antialiased">
  <sc-if value="{{frame}}" hint-placeholder-val="{{ true }}"><div style="position: absolute; inset: 20px; border: 2px solid #ffffff; pointer-events: none; z-index: 20"></div></sc-if>
  <div style="position: absolute; inset: {{scrollInset}}; overflow-y: auto; display: flex; flex-direction: column">

  <nav style="position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: center; min-height: 64px; padding: 0 56px; box-sizing: border-box; background: #000000; border-bottom: 1px solid #303030">
    <a href="Landing.dc.html" style="font-size: 14px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: #ffffff; text-decoration: none; padding: 20px 0">Digit Recognition</a>
    <div style="display: flex; flex-wrap: wrap; gap: 28px; font-size: 14px">
      <a href="Stage1.dc.html" class="tab tab-active" aria-current="page">Stage 1</a>
      <a href="Stage2.dc.html" class="tab">Stage 2</a>
      <a href="Stage3.dc.html" class="tab">Stage 3</a>
      <a href="History.dc.html" class="tab">History</a>
    </div>
  </nav>

  <main style="flex: 1; width: 100%; max-width: 1120px; margin: 0 auto; padding: 72px 56px 96px; box-sizing: border-box; display: flex; flex-direction: column; gap: 40px">
    <header style="display: flex; flex-direction: column; gap: 14px">
      <span style="font-size: 12px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: #38bdf8">Stage 01</span>
      <h1 style="margin: 0; font-size: 31px; font-weight: 400; line-height: 1.2">Stage 1 — Binary Classification</h1>
      <p style="margin: 0; font-size: 16px; line-height: 1.7; color: #8f8f8f">Draw a 0 or 1 on the 3×3 grid, then click <em style="color: #ffffff; font-style: normal; text-decoration: underline; text-underline-offset: 5px">Recognize</em>.</p>
    </header>

    <div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: stretch">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 28px; padding: 40px; background: #000000; border: 1px solid #303030">
        <div style="display: grid; grid-template-columns: repeat(3, 60px); grid-template-rows: repeat(3, 60px); border: 1px solid #4c4c4c">
          <sc-for list="{{tiles}}" as="t" hint-placeholder-count="9">
            <button type="button" class="{{t.cls}}" onClick="{{t.toggle}}" aria-pressed="{{t.on}}" aria-label="pixel {{t.n}}"></button>
          </sc-for>
        </div>
        <div style="display: flex; gap: 12px">
          <button type="button" class="btn" onClick="{{recognize}}">Recognize</button>
          <button type="button" class="btn btn-ghost" onClick="{{refresh}}">Refresh</button>
        </div>
      </div>

      <div style="flex: 1 1 300px; min-width: 260px; display: flex; flex-direction: column; gap: 12px; padding: 28px; background: #000000; border: 1px solid {{outBorder}}">
        <span style="font-size: 12px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: {{outLabel}}">Output</span>
        <sc-if value="{{hasResult}}" hint-placeholder-val="{{ false }}">
          <div style="font-size: 16px; line-height: 1.9; color: #8f8f8f">This is:<br><span style="color: #ffffff; letter-spacing: .02em">0: 18%    1: 82%</span></div>
          <span style="font-size: 12px; color: #616161">example values</span>
        </sc-if>
        <sc-if value="{{noResult}}" hint-placeholder-val="{{ true }}">
          <div style="font-size: 16px; line-height: 1.9; color: #8f8f8f">awaiting input</div>
        </sc-if>
      </div>
    </div>
  </main>

  <footer style="width: 100%; max-width: 1120px; margin: 0 auto; padding: 0 56px 72px; box-sizing: border-box">
    <div style="display: flex; flex-wrap: wrap; gap: 24px 32px; padding: 28px 0">
      <div style="flex: 1 1 260px; display: flex; gap: 20px; align-items: center; justify-content: center">
        <img src="/_blob/c0a1501716f131c78b44d11483c83e85" alt="Sreda obitaniya logo" style="width: 64px; height: 64px; display: block; flex-shrink: 0">
        <div style="display: flex; flex-direction: column; gap: 8px; font-size: 16px; min-width: 0"><span>Среда обитания</span><span class="meta" style="color: #c7c7c7; text-underline-offset: 6px">@obitaniya_sreda</span></div>
      </div>
      <div style="flex: 1 1 260px; display: flex; gap: 20px; align-items: center; justify-content: center">
        <img src="/_blob/427f384a5ffa9f545d5e99a575ee069e" alt="Tech.ProSvet logo" style="width: 64px; height: 64px; display: block; flex-shrink: 0">
        <div style="display: flex; flex-direction: column; gap: 8px; font-size: 16px; min-width: 0"><span>Tech.ProSvet</span><span class="meta" style="color: #c7c7c7; text-underline-offset: 6px">@tech_illumination</span></div>
      </div>
    </div>
  </footer>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"bg":{"editor":"enum","options":["image","svg","none"],"default":"image"},"frame":{"editor":"boolean","default":true},"$preview":{"width":1280,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { on: [false, true, false, false, true, false, false, true, false], result: false };
  }
  renderVals() {
    const on = this.state.on;
    const tiles = on.map((v, i) => ({
      n: i + 1,
      on: v ? 'true' : 'false',
      cls: v ? 'tile tile-on' : 'tile',
      toggle: () => { const next = on.slice(); next[i] = !next[i]; this.setState({ on: next }); },
    }));
    const r = this.state.result;
    return {
      bg: this.props.bg ?? 'image',
      frame: this.props.frame ?? true,
      scrollInset: (this.props.frame ?? true) ? '22px' : '0',
      tiles,
      hasResult: r,
      noResult: !r,
      outBorder: r ? '#38bdf8' : '#303030',
      outLabel: r ? '#38bdf8' : '#8f8f8f',
      recognize: () => this.setState({ result: true }),
      refresh: () => this.setState({ on: on.map(() => false), result: false }),
    };
  }
}
</script>
</body>
</html>
